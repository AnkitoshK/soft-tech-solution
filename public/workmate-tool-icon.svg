<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="wmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="wmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="driverHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="driverShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wmBg)" stroke="url(#wmBorder)" stroke-width="2" />

  <!-- Subtle tech circuit ring -->
  <circle cx="32" cy="32" r="21" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Screwdriver (rotated -45 deg) -->
  <g transform="rotate(-45 32 32)">
    <!-- Flathead Tip -->
    <path d="M 30.5 10 L 33.5 10 L 34 14 L 30 14 Z" fill="#38bdf8" />
    <!-- Steel Shaft -->
    <rect x="30" y="14" width="4" height="17" fill="url(#driverShaft)" rx="0.5" />
    <!-- Collar -->
    <rect x="28.5" y="30" width="7" height="3" rx="1" fill="#0284c7" />
    <!-- Ergonomic Handle -->
    <rect x="27.5" y="33" width="9" height="18" rx="3.5" fill="url(#driverHandle)" />
    <!-- Grip Grooves -->
    <line x1="28.5" y1="37" x2="35.5" y2="37" stroke="#0c4a6e" stroke-width="1.2" />
    <line x1="28.5" y1="41" x2="35.5" y2="41" stroke="#0c4a6e" stroke-width="1.2" />
    <line x1="28.5" y1="45" x2="35.5" y2="45" stroke="#0c4a6e" stroke-width="1.2" />
  </g>

  <!-- Wrench (rotated 45 deg) -->
  <g transform="rotate(45 32 32)">
    <!-- Wrench Head with Jaw -->
    <path d="M 23.5 21 C 22 16 24 11.5 28 8.5 C 29 8 30 9 29.5 10.5 C 29 12 30 14.5 32 14.5 C 34 14.5 35 12 34.5 10.5 C 34 9 35 8 36 8.5 C 40 11.5 42 16 40.5 21 L 34.5 23 L 34.5 45 L 29.5 45 L 29.5 23 Z" fill="url(#wrenchGrad)" />
    <!-- Handle Groove -->
    <rect x="30.8" y="24" width="2.4" height="18" rx="1" fill="#475569" opacity="0.6" />
    <!-- Ring end (box wrench end) -->
    <circle cx="32" cy="49" r="6.5" fill="url(#wrenchGrad)" />
    <circle cx="32" cy="49" r="3.2" fill="#0f172a" />
  </g>

  <!-- Center Pulse Spark / Node -->
  <circle cx="32" cy="32" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>