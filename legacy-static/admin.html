<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STS Admin | Enquiries</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f7fb;color:#182238}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{background:#fff;width:min(430px,100%);padding:34px;border-radius:22px;box-shadow:0 20px 60px #18223818}.brand{font:800 22px Poppins;color:#23417b}.brand b{color:#e8752c}.login h1{font:800 30px Poppins;margin:25px 0 8px}.muted{color:#6b7280}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d9dfeb;border-radius:10px;font:inherit;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#e8752c}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.primary{background:#e8752c;color:#fff;width:100%}.error{color:#c62828;font-size:13px;min-height:18px}.app{display:none}.top{background:#fff;border-bottom:1px solid #e5e9f1;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.top-actions{display:flex;gap:10px}.outline{background:#fff;border:1px solid #d7ddea}.container{max-width:1200px;margin:0 auto;padding:28px 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px #1822380a}.stat b{display:block;font:800 28px Poppins}.stat span{font-size:13px;color:#6b7280}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.search{padding:11px 13px;border:1px solid #d9dfeb;border-radius:10px;min-width:240px}.table-wrap{background:#fff;border-radius:16px;overflow:auto;box-shadow:0 4px 20px #1822380a}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:14px 15px;border-bottom:1px solid #edf0f5;font-size:13px;vertical-align:top}.table th{background:#fafbfc;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#667085}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}.row-actions{display:flex;gap:7px}.small{padding:7px 9px;font-size:12px}.danger{background:#fff1f1;color:#c62828;border:1px solid #ffd3d3}.select{padding:7px;border:1px solid #d9dfeb;border-radius:8px}.empty{text-align:center;padding:45px;color:#7a8496}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{padding:14px}.container{padding:20px 12px}}
</style></head><body>
<div id="loginView" class="login-wrap"><form id="loginForm" class="login"><div class="brand">Soft <b>Tech</b> Solution</div><h1>Admin Panel</h1><p class="muted">Manage website enquiries securely.</p><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><div id="loginError" class="error"></div><button class="btn primary" type="submit">Sign in</button></form></div>
<div id="app" class="app"><header class="top"><div class="brand">Soft <b>Tech</b> Solution <span style="font:500 12px Inter;color:#6b7280">/ Admin</span></div><div class="top-actions"><button id="refresh" class="btn outline">Refresh</button><button id="logout" class="btn outline">Logout</button></div></header><main class="container"><div class="stats"><div class="stat"><span>Total</span><b id="total">0</b></div><div class="stat"><span>New</span><b id="newCount">0</b></div><div class="stat"><span>Contacted</span><b id="contacted">0</b></div><div class="stat"><span>Converted</span><b id="converted">0</b></div></div><div class="toolbar"><input id="search" class="search" placeholder="Search name, email, service..."><select id="statusFilter" class="select"><option>All</option><option>New</option><option>Contacted</option><option>Qualified</option><option>Converted</option><option>Closed</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Lead</th><th>Service</th><th>Message</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" style="display:none">No enquiries found.</div></div></main></div>
<script>
const $=s=>document.querySelector(s);let all=[];
function showApp(){ $('#loginView').style.display='none';$('#app').style.display='block';load(); }
async function load(){ const status=$('#statusFilter').value; const r=await fetch('/api/enquiries'+(status!=='All'?`?status=${encodeURIComponent(status)}`:'')); if(r.status===401){$('#loginView').style.display='grid';$('#app').style.display='none';return} all=await r.json();render(); }
function render(){const q=$('#search').value.toLowerCase();const data=all.filter(x=>`${x.name} ${x.email} ${x.service} ${x.message}`.toLowerCase().includes(q));$('#total').textContent=all.length;$('#newCount').textContent=all.filter(x=>x.status==='New').length;$('#contacted').textContent=all.filter(x=>x.status==='Contacted').length;$('#converted').textContent=all.filter(x=>x.status==='Converted').length;$('#rows').innerHTML=data.map(x=>`<tr><td><b>${esc(x.name)}</b><br><a href="mailto:${esc(x.email)}">${esc(x.email)}</a>${x.phone?`<br>${esc(x.phone)}`:''}</td><td>${esc(x.service||'—')}</td><td>${esc(x.message||'—')}</td><td><select class="select" onchange="updateStatus('${x.id}',this.value)">${['New','Contacted','Qualified','Converted','Closed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(x.created_at).toLocaleString()}</td><td><div class="row-actions"><button class="btn small danger" onclick="removeLead('${x.id}')">Delete</button></div></td></tr>`).join('');$('#empty').style.display=data.length?'none':'block';}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function updateStatus(id,status){await fetch('/api/enquiries?id='+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
async function removeLead(id){if(!confirm('Delete this enquiry permanently?'))return;await fetch('/api/enquiries?id='+encodeURIComponent(id),{method:'DELETE'});load()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(r.ok)showApp();else $('#loginError').textContent=(await r.json()).error||'Login failed';});
$('#logout').onclick=async()=>{await fetch('/api/login',{method:'DELETE'});location.reload()};$('#refresh').onclick=load;$('#search').oninput=render;$('#statusFilter').onchange=load;load();
</script></body></html>
